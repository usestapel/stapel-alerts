[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-alerts"
version = "0.2.0"
description = "An alert store for a Stapel fleet that has no Sentry"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "alerts", "errors", "observability", "sentry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    # Floor: 0.68.1, the release that announces a DLQ park
    # (stapel_core.signals.bus_event_parked) instead of only counting it.
    # The 0.1 line accepted 0.67.0 and carried a log-line fallback for cores
    # without the signal; 0.2 makes the structured input unconditional, so
    # the floor is now the version that guarantees it.
    "stapel-core>=0.68.1,<1.0",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-alerts"
Repository = "https://github.com/usestapel/stapel-alerts"
Documentation = "https://github.com/usestapel/stapel-alerts#readme"
Changelog = "https://github.com/usestapel/stapel-alerts/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-alerts/issues"

[project.optional-dependencies]
# Forwarding to Sentry when a DSN is configured. Optional on purpose: the
# whole point of this library is that a fleet without Sentry is not a fleet
# without an alert store.
sentry = ["sentry-sdk>=2.0"]
all = ["sentry-sdk>=2.0"]

[tool.stapel.readme]
# stapel-alerts is not on PyPI yet: the org's pending publisher has to exist
# before the first Publish job can succeed. Until it does, the generated
# README must not print an install line that fails.
pypi = false

[tool.setuptools]
package-dir = {"stapel_alerts" = "."}
packages = [
    "stapel_alerts",
    "stapel_alerts.migrations",
    "stapel_alerts.management",
    "stapel_alerts.management.commands",
]

[tool.setuptools.package-data]
stapel_alerts = [
    "py.typed",
    "migrations/*.py",
    "schemas/**/*.json",
    "translations/*.json",
    "docs/*.json",
    "docs/llms.txt",
    "CONFIG.MD",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
